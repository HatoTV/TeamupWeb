name: Deploy production

# Production is deployed at the end of each LoL stats collection run (lol-stats.yml: 00:17, 06:17, 12:17 and
# 18:17 UTC) and each TFT stats run (tft-stats.yml: 03:47 and 15:47 UTC), whatever its outcome, so new data and the
# code merged since go live together.
# Hosting: Cloudflare Worker + static assets (wrangler.jsonc). A push to master does not deploy production by itself:
# this workflow builds master (npm run build:cloudflare) and runs `wrangler deploy`.
# After a collection run, the deployment is skipped when production already runs master's HEAD (the job's
# `environment: Production` records each deployment on GitHub, which the Decide step reads).
# Immediate (urgent fix):
#   - Actions → Deploy production → Run workflow (or `gh workflow run deploy-production.yml`), or
#   - put [deploy-now] in a commit message or pull request title pushed / merged to master.
# Secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers"), CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_run:
    workflows: ['LoL build stats', 'TFT stats']
    types: [completed]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    if: >-
      github.event_name != 'push' ||
      contains(toJSON(github.event.commits.*.message), '[deploy-now]')
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "workflow_run" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "Immediate deployment ($EVENT)."; exit 0
          fi
          head=$(gh api "repos/$REPO/commits/master" --jq .sha)
          live=""
          for id in $(gh api "repos/$REPO/deployments?environment=Production&per_page=20" --jq '.[].id'); do
            state=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
            if [ "$state" = "success" ]; then live=$(gh api "repos/$REPO/deployments/$id" --jq .sha); break; fi
          done
          if [ "$live" = "$head" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "Production already runs $head."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "Deploying $head (production: ${live:-unknown})."
          fi

      - uses: actions/checkout@v4
        if: steps.decide.outputs.deploy == 'true'
        with:
          ref: master

      - uses: actions/setup-node@v4
        if: steps.decide.outputs.deploy == 'true'
        with:
          node-version: 22.x
          cache: npm

      - name: Build
        if: steps.decide.outputs.deploy == 'true'
        run: |
          npm ci
          npm run build:cloudflare

      - name: Deploy to Cloudflare
        if: steps.decide.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret missing"; exit 1; }
          npx --yes wrangler@4 deploy --message "master $(git rev-parse --short HEAD)"
