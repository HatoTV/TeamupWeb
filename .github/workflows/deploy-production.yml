name: Deploy production

# Production is deployed at the end of each LoL stats collection run (lol-stats.yml: 00:17, 06:17, 12:17 and
# 18:17 UTC), whatever its outcome, so new data and the code merged since go live together.
# vercel.json sets git.deploymentEnabled.master = false: a push to master no longer deploys production by itself
# (pull request branches keep their preview deployments). This workflow calls the Vercel Deploy Hook of master.
# After a collection run, the deployment is skipped when production already runs master's HEAD.
# Immediate (urgent fix):
#   - Actions → Deploy production → Run workflow (or `gh workflow run deploy-production.yml`), or
#   - put [deploy-now] in a commit message or pull request title pushed / merged to master.
# Secret: VERCEL_DEPLOY_HOOK (Vercel → Settings → Git → Deploy Hooks, branch master).

on:
  workflow_run:
    workflows: ['LoL build stats']
    types: [completed]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'push' ||
      contains(toJSON(github.event.commits.*.message), '[deploy-now]')
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "workflow_run" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "Immediate deployment ($EVENT)."; exit 0
          fi
          head=$(gh api "repos/$REPO/commits/master" --jq .sha)
          live=""
          for id in $(gh api "repos/$REPO/deployments?environment=Production&per_page=20" --jq '.[].id'); do
            state=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
            if [ "$state" = "success" ]; then live=$(gh api "repos/$REPO/deployments/$id" --jq .sha); break; fi
          done
          if [ "$live" = "$head" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "Production already runs $head."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "Deploying $head (production: ${live:-unknown})."
          fi

      - name: Trigger the Vercel Deploy Hook
        if: steps.decide.outputs.deploy == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK" || { echo "::error::VERCEL_DEPLOY_HOOK secret missing"; exit 1; }
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
