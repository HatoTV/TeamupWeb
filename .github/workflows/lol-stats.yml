name: LoL build stats

# Daily collection of ranked games (Riot API, production key), aggregation, new champions sync, community tips
# rework detection, JSON commit and Vercel redeploy.
# Secrets: RIOT_API_KEY, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, VERCEL_DEPLOY_HOOK.
# Private repository: each daily run uses about budget + 8 minutes of the GitHub Actions allowance
# (50 + 8 = 58 min/day ≈ 1 750 min/month, within the 2 000 free minutes).

on:
  schedule:
    - cron: '17 5 * * *' # every day at 05:17 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = crawl + publish; crawl = collection only; publish = aggregation and publication only; smoke = key and limits check'
        type: choice
        options: [full, crawl, publish, smoke]
        default: full
      budget_minutes:
        description: Crawl time budget (minutes, 330 at most)
        default: '50'
      platforms:
        description: Platforms (comma separated, empty = enabled ones in tools/lol-stats/src/config.ts)
        default: ''

concurrency:
  group: lol-stats
  cancel-in-progress: false

permissions:
  contents: write
  issues: write # « Rework détecté » and « Nouveau champion » issues

jobs:
  stats:
    runs-on: ubuntu-latest
    # Long manual crawls get the GitHub-hosted maximum; daily runs stop well before the budget is exceeded.
    timeout-minutes: ${{ fromJSON(inputs.budget_minutes || '50') > 60 && 355 || 75 }}
    env:
      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      MODE: ${{ inputs.mode || 'full' }}
      LOL_STATS_BUDGET_MINUTES: ${{ inputs.budget_minutes || '50' }}
      LOL_STATS_PLATFORMS: ${{ inputs.platforms || '' }}
      LOL_STATS_LOW_SAMPLE_GAMES: '200' # below this many games a champion/role page shows the small-sample warning
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: tools/lol-stats/package-lock.json

      - name: Install
        working-directory: tools/lol-stats
        run: npm ci

      - name: Riot key and limits check
        if: env.MODE == 'smoke'
        working-directory: tools/lol-stats
        run: node src/smoke.ts

      - name: Tests
        if: env.MODE != 'smoke'
        working-directory: tools/lol-stats
        run: npm test

      - name: Crawl (patch detection + collection within the time budget, state saved to R2 every 5 min)
        if: env.MODE == 'full' || env.MODE == 'crawl'
        working-directory: tools/lol-stats
        run: node src/cli.ts crawl

      - name: Aggregate and publish JSON
        if: env.MODE == 'full' || env.MODE == 'publish'
        working-directory: tools/lol-stats
        run: node src/cli.ts publish

      - name: Sync new champions (data, index, sitemap, « Nouveau champion » issue)
        id: sync
        if: env.MODE == 'full' || env.MODE == 'publish'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/sync-champions.mjs

      - name: Detect champion reworks (community tips, once per new patch)
        if: steps.sync.outputs.new_patch == 'true'
        working-directory: tools/community-tips
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          node src/detect-reworks.ts

      - name: Commit the data if it changed
        id: commit
        if: env.MODE == 'full' || env.MODE == 'publish'
        run: |
          git add public/data/lol public/assets/data data/lol/AllChampions.json routes.txt public/sitemap.xml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data change."
          else
            git config user.name "teamupp-stats-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Data: LoL build stats $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Redeploy the prerendered site (Vercel Deploy Hook)
        if: steps.commit.outputs.changed == 'true' && env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
