name: LoL build stats

# Daily collection of ranked games (Riot API), aggregation, JSON commit and Vercel redeploy.
# Secrets: RIOT_API_KEY, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, VERCEL_DEPLOY_HOOK.
# Private repository: each run uses about budget + 5 minutes of the GitHub Actions allowance.

on:
  schedule:
    - cron: '17 5 * * *' # every day at 05:17 UTC
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: Crawl time budget (minutes)
        default: '35'
      platforms:
        description: Platforms (comma separated)
        default: 'EUW1'

concurrency:
  group: lol-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      LOL_STATS_BUDGET_MINUTES: ${{ inputs.budget_minutes || '35' }}
      LOL_STATS_PLATFORMS: ${{ inputs.platforms || 'EUW1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: tools/lol-stats/package-lock.json

      - name: Install
        working-directory: tools/lol-stats
        run: npm ci

      - name: Tests
        working-directory: tools/lol-stats
        run: npm test

      - name: Crawl (patch detection + collection within the time budget)
        working-directory: tools/lol-stats
        run: node src/cli.ts crawl

      - name: Aggregate and publish JSON
        working-directory: tools/lol-stats
        run: node src/cli.ts publish

      - name: Commit the data if it changed
        id: commit
        run: |
          git add public/data/lol
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data change."
          else
            git config user.name "teamupp-stats-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Data: LoL build stats $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Redeploy the prerendered site (Vercel Deploy Hook)
        if: steps.commit.outputs.changed == 'true' && env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
