name: LoL build stats

# Complete collection of ranked games (Riot API, production key) on EUW1, KR and NA1, current and previous patch:
#   00:17 UTC  crawl (5 h 30)
#   12:17 UTC  crawl (4 h) + aggregation of both patches, upload to the public R2 bucket, new champions sync,
#              community tips rework detection, commit of the prerendered subset and Vercel redeploy.
# Secrets: RIOT_API_KEY, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, VERCEL_DEPLOY_HOOK.
# Variable: R2_PUBLIC_BUCKET (public statistics bucket; publication is skipped until it is set).
# About 10 h of runner time a day: scheduled runs only start once the repository is public (free minutes).

# Automatic updates are paused for now: manual runs only. To resume, restore:
#   schedule:
#     - cron: '17 0 * * *'
#     - cron: '17 12 * * *'
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = crawl + publish; crawl = collection only; publish = aggregation and publication only; smoke = key and limits check'
        type: choice
        options: [full, crawl, publish, smoke, count]
        default: full
      budget_minutes:
        description: Crawl time budget (minutes, 330 at most)
        default: '240'
      platforms:
        description: Platforms (comma separated, empty = enabled ones in tools/lol-stats/src/config.ts)
        default: ''

concurrency:
  group: lol-stats
  cancel-in-progress: false

permissions:
  contents: write
  issues: write # « Rework détecté » and « Nouveau champion » issues

jobs:
  stats:
    runs-on: ubuntu-latest
    # Scheduled runs need the free minutes of a public repository.
    if: github.event_name != 'schedule' || !github.event.repository.private
    timeout-minutes: 355
    env:
      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      R2_PUBLIC_BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}
      MODE: ${{ inputs.mode || (github.event.schedule == '17 12 * * *' && 'full' || 'crawl') }}
      LOL_STATS_BUDGET_MINUTES: ${{ inputs.budget_minutes || (github.event.schedule == '17 12 * * *' && '240' || '330') }}
      LOL_STATS_PLATFORMS: ${{ inputs.platforms || '' }}
      LOL_STATS_LOW_SAMPLE_GAMES: '200' # below this many games a champion/role page shows the small-sample warning
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: tools/lol-stats/package-lock.json

      - name: Install
        working-directory: tools/lol-stats
        run: npm ci

      - name: Riot key and limits check
        if: env.MODE == 'smoke'
        working-directory: tools/lol-stats
        run: node src/smoke.ts

      - name: Count players per tier (sizing of a complete collection)
        if: env.MODE == 'count'
        working-directory: tools/lol-stats
        run: |
          node src/r2-setup.ts || true
          node src/count-players.ts

      - name: Tests
        if: env.MODE != 'smoke' && env.MODE != 'count'
        working-directory: tools/lol-stats
        run: npm test

      - name: Crawl (current and previous patch, within the time budget, state saved to R2 every 5 min)
        if: env.MODE == 'full' || env.MODE == 'crawl'
        working-directory: tools/lol-stats
        run: node src/cli.ts crawl

      - name: Aggregate both patches and publish (public R2 bucket + prerendered subset in Git)
        if: (env.MODE == 'full' || env.MODE == 'publish') && env.R2_PUBLIC_BUCKET != ''
        working-directory: tools/lol-stats
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node src/cli.ts publish

      - name: Sync new champions (data, index, sitemap, « Nouveau champion » issue)
        id: sync
        if: env.MODE == 'full' || env.MODE == 'publish'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/sync-champions.mjs

      - name: Detect champion reworks (community tips, once per new patch)
        if: steps.sync.outputs.new_patch == 'true'
        working-directory: tools/community-tips
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          node src/detect-reworks.ts

      - name: Commit the data if it changed
        id: commit
        if: env.MODE == 'full' || env.MODE == 'publish'
        run: |
          git add public/data/lol public/assets/data data/lol/AllChampions.json routes.txt public/sitemap.xml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data change."
          else
            # Vercel (Hobby, private repository) only deploys commits authored by the project owner (authorised by HatoTV).
            git config user.name "HatoTV"
            git config user.email "171453592+HatoTV@users.noreply.github.com"
            git commit -m "Data: LoL build stats $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Redeploy the prerendered site (Vercel Deploy Hook)
        if: steps.commit.outputs.changed == 'true' && env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
