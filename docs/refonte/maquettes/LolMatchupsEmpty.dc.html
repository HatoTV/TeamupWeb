<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>TeamUpp — Matchups, aucun champion choisi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0D18}
a{color:#F1F1F7;text-decoration:none}
.tu-pick{transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s ease}.tu-pick:hover{transform:translateY(-3px);border-color:#4FD18B}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #FFC93C;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.tu-pick{transition:none}.tu-pick:hover{transform:none}}
</style>
</helmet>
<div style="background:#0D0D18;color:#F1F1F7;font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.55;min-height:100vh">
<dc-import name="Topbar" game="lol" hint-size="100%,64px"></dc-import>
<div style="display:flex;flex-wrap:wrap;align-items:stretch">
<div style="flex:1 1 272px;max-width:100%"><dc-import name="LolSidebar" active="matchups" hint-size="100%,1100px"></dc-import></div>
<main style="flex:999 1 560px;min-width:0">

<section style="position:relative;overflow:hidden;border-bottom:1px solid #23233A">
<img src="../assets/site_matchup_bkg.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%">
<div style="position:absolute;inset:0;background:linear-gradient(0deg,#0D0D18 5%,rgba(13,13,24,.72) 50%,rgba(13,13,24,.6))"></div>
<div style="position:relative;padding:44px 40px 40px;display:flex;flex-direction:column;align-items:center;text-align:center">
<h1 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-style:italic;font-size:64px;line-height:.92;text-transform:uppercase">Maîtrisez chaque <span style="color:#FFC93C">matchup</span></h1>
<p style="margin:10px 0 0;font-size:18px;color:#D2D2E0">Stratégies et conseils pour vos affrontements !</p>

<div style="margin-top:36px;display:flex;align-items:center;gap:36px;flex-wrap:wrap;justify-content:center">
<div style="display:flex;flex-direction:column;align-items:center;gap:14px;width:280px">
<button type="button" aria-label="Choisir ton champion" style="width:148px;height:148px;border-radius:50%;border:3px dashed #4FD18B;background:rgba(79,209,139,.08);box-shadow:0 0 0 10px rgba(79,209,139,.10),0 0 60px rgba(79,209,139,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#6FE0A2;cursor:pointer">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
<span style="font:700 15px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase">Étape 1</span>
</button>
<span style="font:700 22px 'Barlow Condensed',sans-serif;text-transform:uppercase;color:#6FE0A2">Ton champion</span>
<label style="display:flex;align-items:center;gap:10px;width:100%;height:50px;padding:0 16px;box-sizing:border-box;border-radius:999px;background:rgba(13,13,24,.9);border:1px solid #4FD18B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A8A8BF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="search" placeholder="Rechercher un champion" aria-label="Ton champion" style="flex:1;min-width:0;border:0;background:transparent;color:#F1F1F7;font:500 16px Barlow,sans-serif"></label>
</div>

<span style="font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:700;font-size:72px;line-height:1;color:#FFC93C;opacity:.9">VS</span>

<div style="display:flex;flex-direction:column;align-items:center;gap:14px;width:280px;opacity:.55">
<span aria-hidden="true" style="width:148px;height:148px;border-radius:50%;border:3px dashed #FF4F6D;background:rgba(255,79,109,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#FF7A92">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg>
<span style="font:700 15px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase">Étape 2</span>
</span>
<span style="font:700 22px 'Barlow Condensed',sans-serif;text-transform:uppercase;color:#FF7A92">L'adversaire</span>
<span style="display:flex;align-items:center;justify-content:center;width:100%;height:50px;border-radius:999px;border:1px dashed #5A3442;font-size:14px;color:#A8A8BF">Choisis d'abord ton champion</span>
</div>
</div>
</div>
</section>

<section aria-labelledby="pick-t" style="padding:32px 40px 0">
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px">
<div><p style="margin:0;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6FE0A2">Étape 1</p><h2 id="pick-t" style="margin:2px 0 0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:32px;text-transform:uppercase">Avec qui joues-tu ?</h2></div>
<div role="group" aria-label="Filtrer par rôle" style="display:flex;gap:6px;flex-wrap:wrap">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="6"><button type="button" aria-pressed="{{r.p}}" style="display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid {{r.b}};background:{{r.bg}};color:#F1F1F7;font:600 14px Barlow,sans-serif;cursor:pointer"><sc-if value="{{r.img}}" hint-placeholder-val="{{ true }}"><img src="{{r.img}}" alt="" style="width:16px;height:16px"></sc-if>{{r.l}}</button></sc-for>
</div>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px">
<sc-for list="{{champs}}" as="c" hint-placeholder-count="24">
<a href="LolMatchupsOne.dc.html" class="tu-pick" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:12px;background:#161626;border:1px solid #2A2A42">
<img src="{{c.img}}" alt="" style="width:60px;height:60px;border-radius:12px">
<span style="font-size:13px;font-weight:600;text-align:center;line-height:1.2">{{c.n}}</span></a>
</sc-for>
</div>
</section>

<section aria-label="Comment ça marche" style="padding:36px 40px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<div style="display:flex;gap:14px;padding:18px;border-radius:14px;background:#161626;border:1px solid #2A2A42">
<span style="flex:none;width:44px;height:44px;border-radius:12px;background:{{s.bg}};color:{{s.c}};display:flex;align-items:center;justify-content:center;font:700 italic 24px 'Barlow Condensed',sans-serif">{{s.n}}</span>
<div><p style="margin:0;font:700 19px 'Barlow Condensed',sans-serif;text-transform:uppercase">{{s.t}}</p><p style="margin:4px 0 0;font-size:14px;color:#A8A8BF">{{s.d}}</p></div>
</div>
</sc-for>
</section>

<section aria-labelledby="scale-t" style="padding:24px 40px 56px">
<div style="padding:20px 22px;border-radius:14px;background:#161626;border:1px solid #2A2A42">
<h2 id="scale-t" style="margin:0 0 14px;font:700 19px 'Barlow Condensed',sans-serif;text-transform:uppercase">Lire la difficulté d'un matchup</h2>
<div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px">
<sc-for list="{{scale}}" as="s" hint-placeholder-count="5">
<div style="padding:14px;border-radius:12px;background:{{s.bg}};border:1px solid {{s.c}}">
<span style="display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:{{s.c}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#120A12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg></span>
<p style="margin:8px 0 0;font:700 19px 'Barlow Condensed',sans-serif;text-transform:uppercase;color:{{s.tc}}">{{s.l}}</p>
<p style="margin:2px 0 0;font-size:13px;line-height:1.45;color:#C9C9DA">{{s.d}}</p>
</div>
</sc-for>
</div>
</div>
</section>
</main>
</div>
<dc-import name="Footer" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
renderVals() {
const B = (p) => p;
const R = { Top: '../assets/site_top.webp', Jungle: '../assets/site_jungle.webp', Mid: '../assets/site_mid.webp', ADC: '../assets/site_adc.webp', Support: '../assets/site_support.webp' };
const C = [['Aatrox','../assets/ic_Aatrox.webp'],['Ahri','../assets/ic_Ahri.webp'],['Akali','../assets/ic_Akali.webp'],['Akshan','../assets/ic_Akshan.webp'],['Alistar','../assets/ic_Alistar.webp'],['Amumu','../assets/ic_Amumu.webp'],['Anivia','../assets/ic_Anivia.webp'],['Annie','../assets/ic_Annie.webp'],['Ashe','../assets/ic_Ashe.webp'],['Bard','../assets/ic_Bard.webp'],['Blitzcrank','../assets/ic_Blitzcrank.webp'],['Braum','../assets/ic_Braum.webp'],['Janna','../assets/ic_Janna.webp'],['Karma','../assets/ic_Karma.webp'],['Leona','../assets/ic_Leona.webp'],['Lulu','../assets/ic_Lulu.webp'],['Morgana','../assets/ic_Morgana.webp'],['Nami','../assets/ic_Nami.webp'],['Nautilus','../assets/ic_Nautilus.webp'],['Pyke','../assets/ic_Pyke.webp'],['Rakan','../assets/ic_Rakan.webp'],['Rell','../assets/ic_Rell.webp'],['Senna','../assets/ic_Senna.webp'],['Thresh','../assets/ic_Thresh.webp']];
return {
roles: [['Tous', ''], ['Top', R.Top], ['Jungle', R.Jungle], ['Mid', R.Mid], ['ADC', R.ADC], ['Support', R.Support]].map(([l, id], i) => ({ l, img: id ? B(id) : '', p: i === 0 ? 'true' : 'false', b: i === 0 ? '#4FD18B' : '#2A2A42', bg: i === 0 ? 'rgba(79,209,139,.14)' : '#161626' })),
champs: C.map(([n, id], i) => ({ n, img: B(id), m: 8 + (i * 7) % 15 })),
steps: [
{ n: 1, t: 'Choisis ton champion', d: 'Dans la grille ou avec la recherche.', c: '#6FE0A2', bg: 'rgba(79,209,139,.16)' },
{ n: 2, t: 'Choisis l\'adversaire', d: 'Ses matchups s\'affichent, classés par difficulté.', c: '#FF7A92', bg: 'rgba(255,79,109,.16)' },
{ n: 3, t: 'Lis les conseils', d: 'Difficulté, astuces de joueurs Challenger, counters.', c: '#FFD56B', bg: 'rgba(255,201,60,.16)' }
],
scale: [
['Très facile', '#39C6D6', '#5FD8E6', 'rgba(57,198,214,.10)', 'M6 13l6-6 6 6M6 19l6-6 6 6', 'Tu domines la lane.'],
['Facile', '#4FD18B', '#6FE0A2', 'rgba(79,209,139,.10)', 'M6 15l6-6 6 6', 'Avantage pour toi.'],
['Moyen', '#FFC93C', '#FFD56B', 'rgba(255,201,60,.10)', 'M5 9h14M5 15h14', 'Matchup équilibré.'],
['Difficile', '#FF8B3D', '#FFA066', 'rgba(255,139,61,.10)', 'M6 9l6 6 6-6', 'Joue prudemment.'],
['Extrême', '#FF4F6D', '#FF7A92', 'rgba(255,79,109,.10)', 'M6 5l6 6 6-6M6 11l6 6 6-6', 'Survis à la lane.']
].map(([l, c, tc, bg, icon, d]) => ({ l, c, tc, bg, icon, d }))
};
}
}
</script>
</body>
</html>
