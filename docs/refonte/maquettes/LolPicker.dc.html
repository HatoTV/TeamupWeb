<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>TeamUpp — Sélecteur de champions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0D18}
a{color:#F1F1F7;text-decoration:none}
.tu-champ{transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s ease}.tu-champ:hover{transform:translateY(-3px);border-color:#9B7BFF}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #FFC93C;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.tu-champ{transition:none}.tu-champ:hover{transform:none}}
</style>
</helmet>
<div style="background:#0D0D18;color:#F1F1F7;font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.55;min-height:100vh">
<dc-import name="Topbar" game="lol" hint-size="100%,64px"></dc-import>
<div style="display:flex;flex-wrap:wrap;align-items:stretch">
<div style="flex:1 1 272px;max-width:100%"><dc-import name="LolSidebar" active="picker" hint-size="100%,1100px"></dc-import></div>
<main style="flex:999 1 560px;min-width:0">

<section style="position:relative;overflow:hidden;border-bottom:1px solid #23233A">
<img src="../assets/site_bkgpicker.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%">
<div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,13,24,.95) 25%,rgba(13,13,24,.55)),linear-gradient(0deg,#0D0D18,rgba(13,13,24,0) 60%)"></div>
<div style="position:relative;padding:44px 40px 36px">
<p style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#9B7BFF">Outil champions</p>
<h1 style="margin:6px 0 0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-style:italic;font-size:60px;line-height:.95;text-transform:uppercase">Sélecteur de champions</h1>
<p style="margin:10px 0 0;font-size:18px;color:#D2D2E0">Explorez la liste et sélectionnez votre champion idéal !</p>
</div>
</section>

<div style="position:sticky;top:0;z-index:2;background:rgba(13,13,24,.94);border-bottom:1px solid #23233A;padding:16px 40px;display:flex;flex-wrap:wrap;gap:12px;align-items:center">
<label style="display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;flex:1 1 220px;max-width:300px;border-radius:8px;background:#161626;border:1px solid #2A2A42">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A8A8BF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" placeholder="Rechercher un champion" aria-label="Rechercher un champion" style="flex:1;min-width:0;border:0;background:transparent;color:#F1F1F7;font:500 15px Barlow,sans-serif">
</label>
<div role="group" aria-label="Rôle" style="display:flex;gap:4px;padding:4px;border-radius:10px;background:#161626;border:1px solid #2A2A42">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="5">
<button type="button" aria-pressed="{{r.pressed}}" aria-label="{{r.label}}" title="{{r.label}}" style="width:40px;height:36px;border:0;border-radius:7px;background:{{r.bg}};display:flex;align-items:center;justify-content:center;cursor:pointer"><img src="{{r.img}}" alt="" style="width:20px;height:20px;opacity:{{r.op}}"></button>
</sc-for>
</div>
<label style="display:flex;align-items:center;gap:8px;font-size:14px;color:#A8A8BF">Difficulté
<select style="height:44px;border-radius:8px;background:#161626;border:1px solid #2A2A42;color:#F1F1F7;font:600 15px Barlow,sans-serif;padding:0 12px">
<option>Toutes</option><option>Facile</option><option>Intermédiaire</option><option>Difficile</option><option>Extrême</option>
</select></label>
<button type="button" style="margin-left:auto;display:flex;align-items:center;gap:10px;height:44px;padding:0 18px;border:0;border-radius:8px;background:#FFC93C;color:#141420;font:700 16px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"></rect><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"></circle><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"></circle><circle cx="12" cy="12" r="1.2" fill="currentColor"></circle></svg>Champion aléatoire (avec filtres)</button>
</div>

<section aria-labelledby="tirage" style="margin:24px 40px 0;position:relative;overflow:hidden;border-radius:16px;border:1px solid #9B7BFF;min-height:220px">
<img src="../assets/splash_Ahri.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 20%">
<div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,13,24,.97) 30%,rgba(13,13,24,.2))"></div>
<div style="position:relative;padding:28px 32px;display:flex;flex-wrap:wrap;gap:20px;align-items:center">
<img src="../assets/ic_Ahri.webp" alt="" style="width:96px;height:96px;border-radius:16px;border:3px solid #9B7BFF">
<div style="flex:1 1 280px">
<p id="tirage" style="margin:0;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#FFC93C">Tirage aléatoire · Mid · Intermédiaire</p>
<p style="margin:2px 0 0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-style:italic;font-size:54px;line-height:1;text-transform:uppercase">Ahri</p>
<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
<a href="#matchups" style="display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:8px;background:#9B7BFF;color:#0D0D18;font:700 15px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase">Voir ses matchups</a>
<button type="button" style="min-height:44px;padding:0 16px;border-radius:8px;border:1px solid #3A3A58;background:rgba(13,13,24,.7);color:#F1F1F7;font:700 15px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer">Relancer</button>
</div>
</div>
</div>
</section>

<section aria-label="Champions" style="padding:24px 40px 56px">
<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px"><h2 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;text-transform:uppercase">Tous les champions</h2><span style="font-size:14px;color:#A8A8BF">Trié par nom</span></div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px">
<sc-for list="{{champs}}" as="c" hint-placeholder-count="16">
<a href="#" class="tu-champ" style="display:flex;flex-direction:column;border-radius:12px;background:#161626;border:1px solid #2A2A42;overflow:hidden">
<div style="position:relative;aspect-ratio:1/1;background:#0D0D18">
<img src="{{c.img}}" alt="" style="width:100%;height:100%;object-fit:cover">
<div style="position:absolute;right:6px;top:6px;display:flex;gap:3px">
<sc-for list="{{c.roles}}" as="ri" hint-placeholder-count="1"><span style="width:22px;height:22px;border-radius:6px;background:rgba(13,13,24,.85);display:flex;align-items:center;justify-content:center"><img src="{{ri}}" alt="" style="width:14px;height:14px"></span></sc-for>
</div>
</div>
<div style="padding:10px 12px">
<p style="margin:0;font-weight:700;font-size:15px">{{c.name}}</p>
<p style="margin:2px 0 0;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:{{c.dc}}"><span style="width:7px;height:7px;border-radius:50%;background:{{c.dc}}"></span>{{c.d}}</p>
</div>
</a>
</sc-for>
</div>
</section>
</main>
</div>
<dc-import name="Footer" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2000}}'>
class Component extends DCLogic {
renderVals() {
const B = (p) => p;
const R = { top: B('../assets/site_top.webp'), jungle: B('../assets/site_jungle.webp'), mid: B('../assets/site_mid.webp'), adc: B('../assets/site_adc.webp'), support: B('../assets/site_support.webp') };
const DL = { 1: ['Facile', '#6FE0A2'], 2: ['Facile', '#6FE0A2'], 3: ['Intermédiaire', '#FFD56B'], 4: ['Difficile', '#FFA066'], 5: ['Extrême', '#FF7A92'] };
const data = [
['Aatrox','../assets/ic_Aatrox.webp',3,'top'],['Ahri','../assets/ic_Ahri.webp',3,'mid'],['Akali','../assets/ic_Akali.webp',3,'top mid'],['Akshan','../assets/ic_Akshan.webp',2,'mid'],
['Alistar','../assets/ic_Alistar.webp',2,'support'],['Amumu','../assets/ic_Amumu.webp',1,'jungle support'],['Anivia','../assets/ic_Anivia.webp',4,'mid'],['Annie','../assets/ic_Annie.webp',1,'mid'],
['Ashe','../assets/ic_Ashe.webp',1,'adc support'],['Bard','../assets/ic_Bard.webp',5,'support'],['Blitzcrank','../assets/ic_Blitzcrank.webp',1,'support'],['Braum','../assets/ic_Braum.webp',3,'support'],
['Janna','../assets/ic_Janna.webp',3,'support'],['Karma','../assets/ic_Karma.webp',1,'support'],['Leona','../assets/ic_Leona.webp',1,'support'],['Lulu','../assets/ic_Lulu.webp',2,'support']
];
const champs = data.map(([name, id, d, roles]) => ({ name, img: B(id), d: DL[d][0], dc: DL[d][1], roles: roles.split(' ').map(r => R[r]) }));
const roles = [['top', 'Top'], ['jungle', 'Jungle'], ['mid', 'Mid'], ['adc', 'ADC'], ['support', 'Support']].map(([k, label], i) => ({ label, img: R[k], pressed: i === 2 ? 'true' : 'false', bg: i === 2 ? '#2E2E48' : 'transparent', op: i === 2 ? 1 : 0.55 }));
return { champs, roles };
}
}
</script>
</body>
</html>
