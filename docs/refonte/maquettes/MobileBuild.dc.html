</helmet>

<button type="button" role="tab" aria-selected="false" style="flex:none;padding:8px 10px;border-radius:10px;border:1px solid #2A2A42;background:#161626;color:#C9C9DA;text-align:left;font:600 13px Barlow,sans-serif"><span style="display:block;color:#F1F1F7;font-weight:700">Alternative</span>56,3 % · 4 512</button>

</div>
<p style="margin:12px 0 8px;font-size:13px;font-weight:600;color:#A8A8BF">Départ · Premiers achats</p>
<div style="display:flex;align-items:center;gap:6px">
<img src="/_blob/e4a8d7706d513a980943187d249efa75" alt="Arc de Doran" style="width:34px;height:34px;border-radius:6px"><img src="/_blob/a14cf5c265d658d11a8179d860ed6b09" alt="Potion de soin" style="width:34px;height:34px;border-radius:6px"><img src="/_blob/decbc80e0edffb2363651d1ecef7a8c4" alt="Balise camouflée" style="width:34px;height:34px;border-radius:6px">
<span style="width:1px;height:24px;background:#2A2A42;margin:0 4px"></span>

<span style="margin-left:auto;display:flex;gap:4px"><img src="/_blob/84a659075d7dfeaf9f9d6e2c2dd2be15" alt="Fatigue" style="width:30px;height:30px;border-radius:6px"><img src="/_blob/2d4d24916d788c768995f5995da43287" alt="Saut éclair" style="width:30px;height:30px;border-radius:6px"></span>

</section>
<section style="margin:12px 12px 0;padding:12px 14px;border-radius:12px;background:#161626;border:1px solid #2A2A42">
<p style="margin:0 0 8px;font:700 15px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase">Compétences · max <span style="color:#FFC93C">Q</span> › <span style="color:#4FD18B">E</span> › <span style="color:#36A3FF">W</span></p>
<div style="display:flex;gap:3px">
<sc-for list="{{seq}}" as="s" hint-placeholder-count="18"><span style="flex:1;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font:700 11px 'Barlow Condensed',sans-serif;background:{{s.bg}};color:#0D0D18">{{s.k}}</span></sc-for>
</div>
</section>
<button type="button" style="position:absolute;left:12px;right:12px;bottom:20px;min-height:50px;border:0;border-radius:12px;background:#FFC93C;color:#141420;font:700 16px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase">Copier le build</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const C = { Q: '#FFC93C', W: '#36A3FF', E: '#4FD18B', R: '#FF5C9E' };
return { seq: ['Q','W','E','Q','Q','R','Q','E','Q','E','R','E','E','W','W','R','W','W'].map(k => ({ k, bg: C[k] })) };
}
}
</script>
