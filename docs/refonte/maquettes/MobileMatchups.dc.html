<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>TeamUpp — Matchup mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F1F1F7;text-decoration:none}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0D0D18;color:#F1F1F7;font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.5">
<header style="display:flex;align-items:center;gap:8px;height:56px;padding:0 8px;border-bottom:1px solid #23233A;background:#0B0B15">
<a href="#" aria-label="Retour" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F1F1F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span style="flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;text-transform:uppercase">Matchups</span>
<span style="padding:4px 8px;border-radius:6px;background:rgba(155,123,255,.18);color:#C3B0FF;font-size:12px;font-weight:700">LoL</span>
</header>
<section style="position:relative;height:200px;overflow:hidden">
<div style="position:absolute;inset:0;display:flex"><img src="../assets/splash_Janna.webp" alt="" style="width:50%;height:100%;object-fit:cover;object-position:30% 20%"><img src="../assets/splash_Blitzcrank.webp" alt="" style="width:50%;height:100%;object-fit:cover;object-position:60% 25%"></div>
<div style="position:absolute;inset:0;background:linear-gradient(0deg,#0D0D18 10%,rgba(13,13,24,.45))"></div>
<div style="position:absolute;left:12px;right:12px;bottom:14px;display:flex;align-items:center;justify-content:space-between">
<button type="button" style="display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;color:#F1F1F7;cursor:pointer"><img src="../assets/ic_Janna.webp" alt="" style="width:64px;height:64px;border-radius:50%;border:3px solid #4FD18B"><span style="font:700 18px 'Barlow Condensed',sans-serif;text-transform:uppercase">Janna</span></button>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font:700 italic 38px 'Barlow Condensed',sans-serif;line-height:1;color:#FFC93C">VS</span><span style="padding:3px 8px;border-radius:5px;background:rgba(255,79,109,.2);color:#FF7A92;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Extrême</span></div>
<button type="button" style="display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;color:#F1F1F7;cursor:pointer"><img src="../assets/ic_Blitzcrank.webp" alt="" style="width:64px;height:64px;border-radius:50%;border:3px solid #FF4F6D"><span style="font:700 18px 'Barlow Condensed',sans-serif;text-transform:uppercase">Blitzcrank</span></button>
</div>
</section>
<section style="margin:4px 12px 0;border-radius:12px;background:#161626;border:1px solid #2A2A42;padding:4px 14px 12px">
<sc-for list="{{tips}}" as="t" hint-placeholder-count="3">
<p style="margin:0;display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #23233A;font-size:15px;line-height:1.45;color:#E2E2EE"><span style="flex:none;width:24px;height:24px;border-radius:6px;background:#22223A;color:#FFC93C;display:flex;align-items:center;justify-content:center;font:700 14px 'Barlow Condensed',sans-serif">{{t.n}}</span>{{t.t}}</p>
</sc-for>
<p style="margin:10px 0 0;display:flex;align-items:center;gap:8px;font-size:13px;color:#A8A8BF"><img src="../assets/rank_challenger.webp" alt="" style="width:26px">ShoDesu · Challenger</p>
</section>
<div role="tablist" aria-label="Listes" style="margin:14px 12px 0;display:flex;padding:3px;border-radius:10px;background:#161626;border:1px solid #2A2A42">
<button type="button" role="tab" aria-selected="true" style="flex:1;min-height:40px;border:0;border-radius:8px;background:#2E2E48;color:#F1F1F7;font:700 13px Barlow,sans-serif">Counters</button>
<button type="button" role="tab" aria-selected="false" style="flex:1;min-height:40px;border:0;border-radius:8px;background:transparent;color:#A8A8BF;font:700 13px Barlow,sans-serif">Avantageux</button>
</div>
<div style="margin:8px 12px 0">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<a href="#" style="display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid #1E1E32"><img src="{{r.img}}" alt="" style="width:34px;height:34px;border-radius:8px"><span style="flex:1;font-weight:600">{{r.n}}</span><span style="padding:3px 8px;border-radius:5px;font-size:12px;font-weight:700;color:{{r.c}};background:{{r.bg}}">{{r.d}}</span></a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const B = (p) => p;
const X = ['#FF7A92', 'rgba(255,79,109,.16)'];
return {
tips: ['Si Blitzcrank vous attrape avec son grappin en lane sans Flash, vous mourez.', 'Jouez de façon très prudente pendant toute la phase de lane.', 'Punissez Blitzcrank chaque fois qu\'il rate son grappin.'].map((t, i) => ({ n: i + 1, t })),
rows: [['Blitzcrank', '../assets/ic_Blitzcrank.webp'], ['Pyke', '../assets/ic_Pyke.webp'], ['Senna', '../assets/ic_Senna.webp'], ['Sona', '../assets/ic_Sona.webp'], ['Soraka', '../assets/ic_Soraka.webp']].map(([n, id]) => ({ n, img: B(id), d: 'Extrême', c: X[0], bg: X[1] }))
};
}
}
</script>
</body>
</html>
