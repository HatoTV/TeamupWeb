<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>TeamUpp — Barre de jeux</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<header style="width:100%;box-sizing:border-box;min-height:64px;background:#0B0B15;border-bottom:1px solid #23233A;display:flex;align-items:stretch;flex-wrap:wrap;gap:8px 20px;padding:0 24px;font-family:Barlow,system-ui,sans-serif;color:#F1F1F7">
<a href="#accueil" aria-label="TeamUpp, accueil" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#F1F1F7">
<img src="../assets/site_TeamUp_white.webp" alt="" style="width:30px;height:auto">
<span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.04em">TEAM<span style="color:#FFC93C">UPP</span></span>
</a>
<nav aria-label="Jeux" style="display:flex;align-items:stretch;gap:2px;flex-wrap:wrap">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<a href="{{t.href}}" aria-current="{{t.current}}" style="position:relative;display:flex;align-items:center;gap:10px;padding:0 16px;min-height:64px;text-decoration:none;font-weight:600;font-size:15px;color:{{t.text}};background:{{t.bg}}">
<span style="width:22px;height:22px;border-radius:6px;background:{{t.color}};display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;color:#0B0B15">{{t.short}}</span>{{t.label}}
<sc-if value="{{t.active}}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:{{t.color}}"></span></sc-if>
</a>
</sc-for>
</nav>
<div style="margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0">
<label style="display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;width:260px;max-width:100%;box-sizing:border-box;border-radius:8px;background:#1A1A2C;border:1px solid #2A2A42">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A8A8BF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" placeholder="Champion, guide, mécanique…" aria-label="Rechercher" style="flex:1;min-width:0;border:0;background:transparent;color:#F1F1F7;font:500 14px Barlow,sans-serif">
<span style="font-size:11px;font-weight:700;color:#7F7F99;border:1px solid #33334F;border-radius:4px;padding:1px 5px">/</span>
</label>
<a href="#a-propos" style="display:flex;align-items:center;height:44px;padding:0 10px;text-decoration:none;font-weight:600;font-size:15px;color:{{aboutColor}}">À propos</a>
<div role="group" aria-label="Langue" style="display:flex;height:40px;padding:3px;box-sizing:border-box;border-radius:8px;background:#1A1A2C;border:1px solid #2A2A42">
<button type="button" aria-pressed="true" style="border:0;border-radius:6px;background:#2E2E48;color:#F1F1F7;font:700 13px Barlow,sans-serif;padding:0 10px">FR</button>
<button type="button" aria-pressed="false" style="border:0;border-radius:6px;background:transparent;color:#A8A8BF;font:700 13px Barlow,sans-serif;padding:0 10px">EN</button>
</div>
<a href="https://discord.gg/pM4Eu5quyg" style="display:flex;align-items:center;height:40px;padding:0 16px;border-radius:8px;background:#FFC93C;color:#141420;text-decoration:none;font:700 15px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase">Discord</a>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"game":{"editor":"enum","options":["home","lol","tft","rl","about"],"default":"home"},"$preview":{"width":1440,"height":64}}'>
class Component extends DCLogic {
renderVals() {
const g = this.props.game ?? 'home';
const tabs = [
{ id: 'lol', label: 'League of Legends', short: 'LoL', href: '#lol', color: '#9B7BFF' },
{ id: 'tft', label: 'Teamfight Tactics', short: 'TFT', href: '#tft', color: '#FF5C9E' },
{ id: 'rl', label: 'Rocket League', short: 'RL', href: '#rl', color: '#36A3FF' }
].map(t => ({ ...t, active: t.id === g, current: t.id === g ? 'page' : 'false', text: t.id === g ? '#FFFFFF' : '#A8A8BF', bg: t.id === g ? '#15152A' : 'transparent' }));
return { tabs, aboutColor: g === 'about' ? '#FFFFFF' : '#A8A8BF' };
}
}
</script>
</body>
</html>
