<div class="modal" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="divTitle">
      <span class="close" (click)="closeModal()">&times;</span>
      <h1>{{ "UPDATEREQUEST" | translate }}</h1>
    </div>
    <div *ngIf="!isSend">
      <div class="divSearches">
        <div class="dropdown dropdownChampions">
          <div class="input-group divChoice">
            <!-- Barre de recherche avec image + texte -->
            <img *ngIf="selectedChampion[0].name!==''" [src]="
          'assets/img/championsIcons/' + selectedChampion[0].icon + '.png'
        " alt="{{ selectedChampion[0].name }}" class="iconSelectedChampions iconInsideInput" />
            <div style="position: relative;width: 100%;">
              <input type="text" class="form-control inputSearch"
                [placeholder]="'LOL.MATCHUPS.YOURCHAMPION' | translate" [(ngModel)]="searchTerm"
                (input)="filterChampions()" [ngClass]="{'inputWithIcon': selectedChampion[0].name !== ''}"
                [value]="selectedChampion[0].name" />
              <span class="search-icon">
                <i class="fa fa-search"></i>
              </span>
            </div>
          </div>
          <!-- Dropdown list -->
          <ul class="list-unstyled scrollable-menu" *ngIf="searchTerm && searchTerm!==selectedChampion[0].name">
            <div *ngIf="filteredChampions.length == 0 && !selectedChampion">
              {{ "LOL.MATCHUPS.NOCHAMPION" | translate }}
            </div>
            <li *ngFor="let champion of filteredChampions" class="championLine">
              <a class="dropdown-item txtChampion" (click)="selectChampion(champion)">
                <img [src]="'assets/img/championsIcons/' + champion.icon + '.png'" alt="{{ champion.name }}"
                  class="iconChampions" />
                {{ champion.name }}
              </a>
            </li>
          </ul>
        </div>        

        <div class="clickableVS">
          <h1 class="txtVS">VS</h1>
        </div>
        
        <!-- Deuxième recherche -->
        <div class="dropdown dropdownChampions">
          <div class="input-group divChoice">
            <img *ngIf="selectedChampion2[0].name!==''" [src]="
          'assets/img/championsIcons/' + selectedChampion2[0].icon + '.png'
        " alt="{{ selectedChampion2[0].name }}" class="iconSelectedChampions iconInsideInput" />
            <div style="position: relative;width: 100%;">
              <input type="text" class="form-control inputSearch"
                [placeholder]="'LOL.MATCHUPS.ENEMYCHAMPION' | translate" [(ngModel)]="searchTerm2"
                (input)="filterChampions2()" [ngClass]="{'inputWithIcon': selectedChampion2[0].name !== ''}" />
              <span class="search-icon">
                <i class="fa fa-search"></i>
              </span>
            </div>
          </div>
          <ul class="list-unstyled scrollable-menu" *ngIf="searchTerm2 && searchTerm2!==selectedChampion2[0].name">
            <div *ngIf="filteredChampions2.length == 0 && !selectedChampion2">
              {{ "LOL.MATCHUPS.NOCHAMPION" | translate }}
            </div>
            <li *ngFor="let champion of filteredChampions2" class="championLine">
              <a class="dropdown-item txtChampion" (click)="selectChampion2(champion)">
                <img [src]="'assets/img/championsIcons/' + champion.icon + '.png'" alt="{{ champion.name }}"
                  class="iconChampions" />
                {{ champion.name }}
              </a>
            </li>
          </ul>
        </div>
      </div>
      <div class="divTypeNotif">
        <label for="option1" class="typeNotif">
          <input type="radio" id="option1" name="notificationType" [(ngModel)]="selectedValue"
            value="typeNotification_Nodata" (change)="onSelectionChange()">
          {{ "LOL.MATCHUPS.NODATAMATCHUP" | translate }}
        </label>

        <label for="option2" class="typeNotif">
          <input type="radio" id="option2" name="notificationType" [(ngModel)]="selectedValue"
            value="typeNotification_DataFalse" (change)="onSelectionChange()">
          {{ "LOL.MATCHUPS.FALSEDATAMATCHUP" | translate }}
        </label>
      </div>


      <!-- Affiche l'input texte si l'une des options est sélectionnée -->
      <div *ngIf="isMessageVisible">
        <textarea [placeholder]="'LOL.MATCHUPS.MESSAGEPLACEHOLDER' | translate" class="inputExplanation" rows="3"
          [(ngModel)]="message"></textarea>
      </div>
      <button type="submit" (click)="sendEmail()" class="btnSend">
        {{ "SENDMESSAGE" | translate }}</button>

    </div>
    <div *ngIf="isSend" class="messageOK">
      <img src="assets/img/icons/check.png" class="check" />
      <h3>{{ "MESSAGEOK" | translate }}</h3>
    </div>
  </div>
</div>
