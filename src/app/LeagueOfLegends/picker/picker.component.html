<div class="content scrollbar-lol" #scrollContainer>
  <div class="bkgContent"></div>
  <img class="imgBkg" src="assets/img/bkgpicker.jpg" />
  <div class="title">
    <h1 class="paddingTextMobile">
      {{ "LOL.PICKER.TITLE0" | translate }}
    </h1>
    <h2 class="paddingTextMobile">{{ "LOL.PICKER.SUBTITLE0" | translate }}</h2>
  </div>

  <div class="divContentEmpty"></div>
  <div class="divContent" style="z-index: 100; position: relative">
    <div class="divSearchAndFilter">
      <div class="divSearch">
        <input
          type="text"
          class="form-control inputSearch"
          [(ngModel)]="searchTerm"
          (input)="filterChampions()"
        />
        <span class="search-icon">
          <i class="fa fa-search"></i>
        </span>
      </div>
      <div class="divRole">
        <div
          class="roleTop"
          (click)="SelectRole('top')"
          [ngClass]="{ roleSelected: selectedRole === 'top' }"
        >
          <img src="assets/img/icons/top.png" class="imgRole" />
        </div>
        <div
          class="roleMid"
          (click)="SelectRole('mid')"
          [ngClass]="{ roleSelected: selectedRole === 'mid' }"
        >
          <img src="assets/img/icons/mid.png" class="imgRole" />
        </div>
        <div
          class="roleAdc"
          (click)="SelectRole('adc')"
          [ngClass]="{ roleSelected: selectedRole === 'adc' }"
        >
          <img src="assets/img/icons/adc.png" class="imgRole" />
        </div>
        <div
          class="roleSupport"
          (click)="SelectRole('support')"
          [ngClass]="{ roleSelected: selectedRole === 'support' }"
        >
          <img src="assets/img/icons/support.png" class="imgRole" />
        </div>
        <div
          class="roleJungle"
          (click)="SelectRole('jungle')"
          [ngClass]="{ roleSelected: selectedRole === 'jungle' }"
        >
          <img src="assets/img/icons/jungle.png" class="imgRole" />
        </div>
      </div>
      <div class="divBtnMobile">
        <div>
          <div class="dropdown" (click)="toggleDropdown()" >
            <button
              class="btn btn-secondary dropdown-toggle btnDifficulties"
              type="button"
            >
              <ng-container *ngIf="selectedDifficulty">
                <div
                  style="display: inline-flex; align-items: center; width: 90%"
                >
                  <div
                    class="smallCircle"
                    [ngClass]="{ hidden: selectedDifficulty.id === 0 }"
                    [ngStyle]="{
                      'background-color': getBorderColor(
                        selectedDifficulty.name
                      )
                    }"
                  ></div>
                  <span
                    class="difficultyChamp"
                    [ngStyle]="{
                      color: getBorderColor(selectedDifficulty.name)
                    }"
                    >{{ selectedDifficulty.name }}</span
                  >
                </div>
              </ng-container>

              <!-- Ajout de la flèche manuellement -->
            </button>
            <div class="dropdown-menu" [class.show]="isOpen">
              <label
                class="dropdown-item"
                *ngFor="let difficulty of difficulties"
                (click)="onSelect(difficulty)"
              >
                <div class="divDifficulty margin15">
                  <div
                    class="smallCircle"
                    [ngClass]="{ hidden: difficulty.id === 0 }"
                    [ngStyle]="{
                      'background-color': getBorderColor(difficulty.name)
                    }"
                  ></div>
                  <span
                    class="difficultyChamp"
                    [ngStyle]="{
                      color: getBorderColor(difficulty.name)
                    }"
                    >{{ difficulty.name }}</span
                  >
                </div>
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div>
      <button (click)="startRandomSelection()" class="btnRandomChampion">
        {{ "LOL.PICKER.PICKCHAMPION" | translate }}
      </button>
      <div
        class="divChampionSelected"
        [ngClass]="{ hidden: !selectedChampion }"
      >
        <div *ngIf="selectedChampion" class="championSelected">
          <div class="divRoleOnChampion">
            <img
              src="assets/img/icons/top.png"
              class="imgRoleOnChampion"
              *ngIf="selectedChampion.isTop"
            />
            <img
              src="assets/img/icons/mid.png"
              class="imgRoleOnChampion"
              *ngIf="selectedChampion.isMid"
            />
            <img
              src="assets/img/icons/adc.png"
              class="imgRoleOnChampion"
              *ngIf="selectedChampion.isAdc"
            />
            <img
              src="assets/img/icons/jungle.png"
              class="imgRoleOnChampion"
              *ngIf="selectedChampion.isJungle"
            />
            <img
              src="assets/img/icons/support.png"
              class="imgRoleOnChampion"
              *ngIf="selectedChampion.isSupport"
            />
          </div>
          <img
            [src]="
              'assets/img/championsIcons/' + selectedChampion.icon + '.png'
            "
            alt="{{ selectedChampion.name }}"
            class="imgChamp"
            [ngStyle]="{
              'border-color': getBorderColor(selectedChampion.difficulty)
            }"
          />
          <span class="nameChamp">{{ selectedChampion.name }}</span>
          <div class="divDifficulty">
            <div
              class="smallCircle"
              [ngStyle]="{
                'background-color': getBorderColor(selectedChampion.difficulty)
              }"
            ></div>
            <span
              class="difficultyChamp"
              [ngStyle]="{
                color: getBorderColor(selectedChampion.difficulty)
              }"
              >{{ selectedChampion.difficulty }}</span
            >
          </div>
        </div>
      </div>
    </div>
    <div class="divListChampions">
      <div *ngFor="let champion of filteredChampions" class="champion">
        <div class="divRoleOnChampion">
          <img
            src="assets/img/icons/top.png"
            class="imgRoleOnChampion"
            *ngIf="champion.isTop"
          />
          <img
            src="assets/img/icons/mid.png"
            class="imgRoleOnChampion"
            *ngIf="champion.isMid"
          />
          <img
            src="assets/img/icons/adc.png"
            class="imgRoleOnChampion"
            *ngIf="champion.isAdc"
          />
          <img
            src="assets/img/icons/jungle.png"
            class="imgRoleOnChampion"
            *ngIf="champion.isJungle"
          />
          <img
            src="assets/img/icons/support.png"
            class="imgRoleOnChampion"
            *ngIf="champion.isSupport"
          />
        </div>
        <img
          [src]="'assets/img/championsIcons/' + champion.icon + '.png'"
          alt="{{ champion.name }}"
          class="imgChamp"
          [ngStyle]="{
            'border-color': getBorderColor(champion.difficulty)
          }"
        />
        <span class="nameChamp">{{ champion.name }}</span>
        <div class="divDifficulty">
          <div
            class="smallCircle"
            [ngStyle]="{
              'background-color': getBorderColor(champion.difficulty)
            }"
          ></div>
          <span
            class="difficultyChamp"
            [ngStyle]="{
              color: getBorderColor(champion.difficulty)
            }"
            >{{ champion.difficulty }}</span
          >
        </div>
      </div>
    </div>
    <br /><br />
  </div>
</div>
