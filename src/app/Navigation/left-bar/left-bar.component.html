<div class="sidebar">
  <div class="header">
    <h1>Champions</h1>
    <hr class="divider" />
  </div>
  <div
    class="lowOpacity section divSection"
    *ngFor="let itemChampions of itemsChampions"
  >
    <div class="logo-wrapper">
      <img [src]="itemChampions.logoUrl" />
    </div>
    <h2>{{ itemChampions.title }}</h2>
  </div>

  <div class="header">
    <h1>Gameplay guides</h1>
    <hr class="divider" />
  </div>
  <div class="lowOpacity divSection" *ngFor="let itemGameplay of itemsGameplay">
    <div class="section">
      <div class="logo-wrapper">
        <img [src]="itemGameplay.logoUrl" />
      </div>
      <h2>{{ itemGameplay.title }}</h2>
    </div>
    <h2 *ngIf="itemGameplay.subtitles">{{ itemGameplay.subtitles }}</h2>
  </div>
</div>
