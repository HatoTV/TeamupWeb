<div class="sidebar">
  <div class="header paddingSidebar">
    <h1>Champions</h1>
    <hr class="divider paddingSidebar" />
  </div>

  <div
    class="section divSection sectionWithoutSubtitle paddingSidebar"
    *ngFor="let itemChampions of itemsChampions"
    [routerLink]="createHref(itemChampions.url)"
  >
    <div class="logo-wrapper">
      <img [src]="itemChampions.logoUrl" />
    </div>
    <h2>{{ itemChampions.title }}</h2>
  </div>

  <div class="header paddingSidebar">
    <h1>Gameplay guides</h1>
    <hr class="divider" />
  </div>

  <div *ngFor="let itemGameplay of itemsGameplay">
    <div class="paddingSidebar sectionWithSubtitle">
      <div
        class="section divSection"
        (click)="toggleItem(itemGameplay);"
        [routerLink]="createHref(itemGameplay.url)"
      >
        <div class="logo-wrapper">
          <img [src]="itemGameplay.logoUrl" />
        </div>
        <h2>{{ itemGameplay.title | translate }}</h2>
        <i
          *ngIf="itemGameplay.subtitles.length > 0"
          style="margin-left: auto"
          class="fas"
          [ngClass]="itemGameplay.isOpen ? 'fa-chevron-up' : 'fa-chevron-down'"
        ></i>
      </div>
      <div *ngIf="itemGameplay.subtitles.length > 0">
        <div
          class="subtitle"
          *ngFor="let subtitle of itemGameplay.subtitles"
          [ngClass]="{ visible: itemGameplay.isOpen }"
        >
          <a
            style="text-decoration: none; color: white"
            [routerLink]="createHref(itemGameplay.url)"
            [fragment]="subtitle | translate"
            ><h3>{{ subtitle | translate }}</h3></a
          >
        </div>
      </div>
    </div>
  </div>
</div>
