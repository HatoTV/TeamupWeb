<div class="sidebar">
  <div style="padding-bottom:100px">
    <div class="header paddingSidebar itemPart1">
      <h1>{{titlePart1}}</h1>
      <hr class="divider paddingSidebar" />
    </div>

    <div class="section divSection sectionWithoutSubtitle paddingSidebar" *ngFor="let itemPart1 of itemsPart1"
      [routerLink]="createHref(itemPart1.url)" routerLinkActive="linkActive">
      <div class="logo-wrapper">
        <img [src]="itemPart1.logoUrl" />
      </div>
      <h2>{{ itemPart1.title }}</h2>
    </div>

    <div class="header paddingSidebar itemPart2">
      <h1>{{titlePart2}}</h1>
      <hr class="divider" />
    </div>

    <div *ngFor="let itemPart2 of itemsPart2">
      <div class="paddingSidebar sectionWithSubtitle" [ngClass]="{'linkActive': isCurrentRoute(itemPart2.url)}">
        <div class="section divSection" (click)="toggleItem(itemPart2);" [routerLink]="createHref(itemPart2.url)">
          <div class="logo-wrapper">
            <img [src]="itemPart2.logoUrl" />
          </div>
          <h2>{{ itemPart2.title | translate }}</h2>
          <i *ngIf="itemPart2.subtitles.length > 0" style="margin-left: auto" class="fas"
            [ngClass]="itemPart2.isOpen ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
        </div>
        <div *ngIf="itemPart2.subtitles.length > 0">
          <div class="subtitle" *ngFor="let subtitle of itemPart2.subtitles; let i = index"
            [ngClass]="{ visible: itemPart2.isOpen }">
            <a style="text-decoration: none; color: white" [routerLink]="createHref(itemPart2.url)"
              (click)="onSectionClick(itemPart2.fragments[i])">
              <h3>{{ subtitle | translate }}</h3>
            </a>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
