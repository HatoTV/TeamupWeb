<div class="topBar">
    <img class="logo" src="assets/img/icons/TeamUptext_white.png" (click)="goToUrlWithoutParam('/home')">
    <div class="divContent">
        <div style="height: 100%;" *ngFor="let itemSections of itemsSections; let i = index;">
            <div [ngClass]="itemSections.isSelected ? 'section isSelected' : 'section'"
                (click)="goToUrl(itemSections.url,i)">
                <div class="logo-wrapper">
                    <img [src]="itemSections.logoUrl" />
                </div>
                <h2 [ngClass]="itemSections.isSelected ? 'boldText' : 'lightText'">{{ itemSections.title }}</h2>
            </div>
        </div>
        <!-- <h2 (click)="goToUrlWithoutParam('/contact')">Contact</h2> -->
        <img [src]="imgTranslation" class="translateIcon" (click)="onChangeLanguage()">
    </div>
</div>

<!-- Mobile -->

<div class="navbar">
    <div class="divContent">
        <div *ngIf="!isMenuOpen">
            <button class="hamburger" (click)="toggleMenu()">☰</button>
        </div>
        <div *ngIf="isMenuOpen">
            <button class="hamburger" (click)="toggleMenu()">X</button>
        </div>
        <left-bar class="scrollbar-lol navbar-menu" [ngClass]="{'active': isMenuOpen}"></left-bar>
        <div style="height: 100%;" *ngFor="let itemSections of itemsSections; let i = index;">
            <div [ngClass]="itemSections.isSelected ? 'section isSelected' : 'section'"
                (click)="goToUrl(itemSections.url,i)">
                <div class="logo-wrapper">
                    <img [src]="itemSections.logoUrl" />
                </div>
            </div>
        </div>
        <img [src]="imgTranslation" class="translateIcon" (click)="onChangeLanguage()">
    </div>
</div>
