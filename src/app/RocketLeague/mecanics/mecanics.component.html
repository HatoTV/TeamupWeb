<app-modal [subname]="subnameModal" [title]="titleModal" [video]="videoModal" [etapes]="etapesModal"
  [explication]="explicationModal" [utility]="utilityModal" [difficulty]="difficultyModal" [showModal]="isModalVisible"
  (closeModalEvent)="closeModal()" class="scrollbar-rl">
</app-modal>


<div class="content scrollbar-rl" #scrollContainer>
  <div class="bkgContent"></div>
  <img class="imgBkg" src="assets/img/rocketLeague/bkgRocketLeague.jpg" />
  <div class="title">
    <!-- <h1 class="paddingTextMobile">{{ "RL.MECANICS.TITLE0" | translate }}</h1>
    <h2 class="paddingTextMobile">{{ "RL.MECANICS.SUBTITLE0" | translate }}</h2> -->
    <img class="logoGame" src="assets/img/rl_logo.png" />
  </div>

  <div class="divContentEmpty"></div>
  <div class="divContent">
    <div class="searchAndFilter">
      <div class="divSearch">
        <input type="text" class="form-control inputSearch" [placeholder]="'RL.MECANICS.SEARCHPLACEHOLDER' | translate"
          [(ngModel)]="searchTerm" (input)="filterMecanics()" />
        <span class="search-icon">
          <i class="fa fa-search"></i>
        </span>
      </div>
      <button class="btnFilter" type="button" (click)="openFilters()"
        [ngClass]="{'btnFilterBkgOpen': isFilterOpen, 'btnFilterBkg': !isFilterOpen}">
        {{ "RL.FILTERS" | translate }}
      </button>
    </div>
    <div [ngClass]="{'fade': true, 'fade-out': !isFilterOpen}">
      <div class="filter-container">
        <!-- Liste des utilités -->
        <div>
          <span class="titleFilter">{{ 'RL.MECANICS.DIFFICULTY' | translate }}</span>
          <div *ngFor="let option of filterOptions | slice: 0:5">
            <div class="divFiltersCheck">
              <input type="checkbox" id="{{ option.id }}" [(ngModel)]="option.selected" (change)="onFilterChange()"
                class="form-check-input" />
              <label class="form-check-label" for="{{ option.id }}">
                <span class="fa-star" [ngClass]="{
                'fa-solid': option.rating >= 1,
                'fa-regular': option.rating < 1
              }"></span>
                <span class="fa-star" [ngClass]="{
                'fa-solid': option.rating >= 2,
                'fa-regular': option.rating < 2
              }"></span>
                <span class="fa-star" [ngClass]="{
                'fa-solid': option.rating >= 3,
                'fa-regular': option.rating < 3
              }"></span>
                <span class="fa-star" [ngClass]="{
                'fa-solid': option.rating >= 4,
                'fa-regular': option.rating < 4
              }"></span>
                <span class="fa-star" [ngClass]="{
                'fa-solid': option.rating >= 5,
                'fa-regular': option.rating < 5
              }"></span>
              </label>
            </div>
          </div>
        </div>

        <!-- Liste des difficultés -->
        <div>
          <span class="titleFilter">{{ 'RL.MECANICS.UTILITY' | translate }}</span>
          <div *ngFor="let option of filterOptions | slice: 5:10">
            <div class="divFiltersCheck">
              <input type="checkbox" id="{{ option.id }}" [(ngModel)]="option.selected" (change)="onFilterChange()"
                class="form-check-input" />
              <label class="form-check-label" for="{{ option.id }}">
                <span class="fa-star" [ngClass]="{
                  'fa-solid': option.rating >= 1,
                  'fa-regular': option.rating < 1
                }"></span>
                <span class="fa-star" [ngClass]="{
                  'fa-solid': option.rating >= 2,
                  'fa-regular': option.rating < 2
                }"></span>
                <span class="fa-star" [ngClass]="{
                  'fa-solid': option.rating >= 3,
                  'fa-regular': option.rating < 3
                }"></span>
                <span class="fa-star" [ngClass]="{
                  'fa-solid': option.rating >= 4,
                  'fa-regular': option.rating < 4
                }"></span>
                <span class="fa-star" [ngClass]="{
                  'fa-solid': option.rating >= 5,
                  'fa-regular': option.rating < 5
                }"></span>
              </label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <span class="titleFilter">{{ 'RL.MECANICS.TRI' | translate }}</span>
          <div style="display: flex;">
            <div style="display: flex;flex-direction: column;margin-right: 30px;">
              <div *ngFor="let option of sortOptions.slice(0, 3)">
                <div class="form-check">
                  <input type="radio" id="{{ option.id }}" name="sortCriteria" [(ngModel)]="sortCriteria"
                    (change)="sortMecanics()" class="form-check-input" [value]="option.id" />
                  <label class="form-check-label txtFilter" for="{{ option.id }}">
                    {{ option.label | translate }}
                  </label>
                </div>
              </div>
            </div>
            <div style="display: flex;flex-direction: column;">
            <div *ngFor="let option of sortOptions.slice(3, 6)">
                <div class="form-check">
                  <input type="radio" id="{{ option.id }}" name="sortCriteria" [(ngModel)]="sortCriteria"
                    (change)="sortMecanics()" class="form-check-input" [value]="option.id" />
                  <label class="form-check-label txtFilter" for="{{ option.id }}">
                    {{ option.label | translate }}
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="divAllMecanics" *ngIf="filteredMecanics.length > 0; else noResults">
      <div *ngFor="let mecanic of filteredMecanics;let i = index" class="divMecanic" (click)="openModal(mecanic)"
        [ngClass]="{ 'filtered': hoverIndex !== null && hoverIndex !== i }" (mouseenter)="onMouseEnter(i)"
        (mouseleave)="onMouseLeave()">
        <div>
          <img src="{{ mecanic.img }}" class="imgMecanic" />
          <div class="divTitleMecanic">
            <h3>{{ mecanic.name }}</h3>
            <h6 *ngIf="mecanic.subname">{{ mecanic.subname }}</h6>
          </div>
          <div class="divStats">
            <div class="divStatsUnique"
              [ngStyle]="{'background-color': getBackgroundColorDifficulty(mecanic.difficulty)}">
              <h5 [innerHtml]="'RL.MECANICS.DIFFICULTY' | translate | safeHtml"></h5>
              <div class="star-rating">
                <span *ngFor="let star of stars; let i = index" class="fa-star" [ngClass]="{
                    'fa-solid': i < mecanic.difficulty,
                    'fa-regular': i >= mecanic.difficulty
                  }">
                </span>
              </div>
            </div>
            <div class="divStatsUnique" [ngStyle]="{'background-color': getBackgroundColorUtility(mecanic.utility)}"
              style="border-top: 3px solid white;border-bottom-left-radius: 10px;border-bottom-right-radius: 10px;">
              <h5 [innerHtml]="'RL.MECANICS.UTILITY' | translate | safeHtml"></h5>
              <div class="star-rating">
                <span *ngFor="let star of stars; let i = index" class="fa-star" [ngClass]="{
                    'fa-solid': i < mecanic.utility,
                    'fa-regular': i >= mecanic.utility
                  }">
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Template à afficher si filteredMecanics est vide -->
    <ng-template #noResults>
      <h4 [innerHtml]="'RL.MECANICS.NOMECANIC' | translate | safeHtml" class="txtNoMecanic"></h4>
    </ng-template>
  </div>
</div>
