<app-modal 
[subname]="subnameModal"
[title]="titleModal"
[video]="videoModal"
[etapes]="etapesModal"
[explication]="explicationModal"
[utility]="utilityModal"
[difficulty]="difficultyModal"
[showModal]="isModalVisible"
(closeModalEvent)="closeModal()"
class="scrollbar-rl">
</app-modal>


<div class="content scrollbar-rl" #scrollContainer>
  <div class="bkgContent" ></div>
  <img class="imgBkg" src="assets/img/rocketLeague/bkgRocketLeague.jpg" />
  <div class="title">
    <h1>{{ "RL.MECANICS.TITLE0" | translate }}</h1>
    <h2>{{ "RL.MECANICS.SUBTITLE0" | translate }}</h2>
  </div>

  <div class="divContentEmpty"></div>
  <div class="divContent">
    <div class="searchAndFilter">
      <input
        type="text"
        class="form-control inputSearch"
        [placeholder]="'RL.MECANICS.SEARCHPLACEHOLDER' | translate"
        [(ngModel)]="searchTerm"
        (input)="filterMecanics()"
      />
      <div class="dropdown">
        <button
          class="btn btn-primary dropdown-toggle"
          type="button"
          id="filterButton"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          Filtres
        </button>
        <ul class="dropdown-menu" aria-labelledby="filterButton">
          <li *ngFor="let option of filterOptions">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="{{ option.id }}"
                [checked]="option.selected"
                (change)="toggleSelection(option)"
              />
              <label class="form-check-label" for="{{ option.id }}">
                <span
                  class="fa-star"
                  [ngClass]="{
                    'fa-solid': option.rating >= 1,
                    'fa-regular': option.rating < 1
                  }"
                ></span>
                <span
                  class="fa-star"
                  [ngClass]="{
                    'fa-solid': option.rating >= 2,
                    'fa-regular': option.rating < 2
                  }"
                ></span>
                <span
                  class="fa-star"
                  [ngClass]="{
                    'fa-solid': option.rating >= 3,
                    'fa-regular': option.rating < 3
                  }"
                ></span>
                <span
                  class="fa-star"
                  [ngClass]="{
                    'fa-solid': option.rating >= 4,
                    'fa-regular': option.rating < 4
                  }"
                ></span>
                <span
                  class="fa-star"
                  [ngClass]="{
                    'fa-solid': option.rating >= 5,
                    'fa-regular': option.rating < 5
                  }"
                ></span>
                {{ option.label | translate }}
              </label>
            </div>
          </li>
        </ul>
      </div>
    </div>
    <div class="divAllMecanics">
      <div
        *ngFor="let mecanic of filteredMecanics;let i = index"
        class="divMecanic"
        (click)="openModal(mecanic)"        
        [ngClass]="{ 'filtered': hoverIndex !== null && hoverIndex !== i }" 
        (mouseenter)="onMouseEnter(i)"
        (mouseleave)="onMouseLeave()"
      >
        <div>
          <img src="{{ mecanic.img }}" class="imgMecanic" />
          <div class="divTitleMecanic">
            <h3>{{ mecanic.name }}</h3>
            <h6 *ngIf="mecanic.subname">{{ mecanic.subname }}</h6>
          </div>
          <div class="divStats">
            <div
              class="divStatsUnique"
              [ngStyle]="{'background-color': getBackgroundColorDifficulty(mecanic.difficulty)}"
            >
              <h5
                [innerHtml]="'RL.MECANICS.DIFFICULTY' | translate | safeHtml"
              ></h5>
              <div class="star-rating">
                <span
                  *ngFor="let star of stars; let i = index"
                  class="fa-star"
                  [ngClass]="{
                    'fa-solid': i < mecanic.difficulty,
                    'fa-regular': i >= mecanic.difficulty
                  }"
                >
                </span>
              </div>
            </div>
            <div class="divStatsUnique"
            [ngStyle]="{'background-color': getBackgroundColorUtility(mecanic.utility)}" style="border-top: 3px solid white;">
              <h5
                [innerHtml]="'RL.MECANICS.UTILITY' | translate | safeHtml"
              ></h5>
              <div class="star-rating">
                <span
                  *ngFor="let star of stars; let i = index"
                  class="fa-star"
                  [ngClass]="{
                    'fa-solid': i < mecanic.utility,
                    'fa-regular': i >= mecanic.utility
                  }"
                >
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
