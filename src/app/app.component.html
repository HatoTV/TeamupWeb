<a class="skip-link" href="#main" (click)="skipToMain($event)">{{ 'NAV.SKIP' | translate }}</a>

<app-topbar />

<div class="shell" [class.shell--lol]="ctx.section() === 'lol'" [attr.data-game]="ctx.game()">
  @if (ctx.section() === 'lol') {
    <app-lol-sidebar class="shell__sidebar" />
  }
  <main id="main" class="shell__main" tabindex="-1">
    <router-outlet />
  </main>
</div>

<app-footer />
<app-mobile-tabbar />
