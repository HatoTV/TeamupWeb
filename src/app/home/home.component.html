<div class="content scrollbar-home" #scrollContainer>
  <div class="bkgContent"></div>
  <img class="imgBkg" src="assets/img/bkgHome.jpg" />
  <div class="container">
    <img src="assets\img\icons\TeamUp_white.png" class="imgTeamup" />
    <h1 class="subtitle" [innerHtml]="'HOME.BIENVENUE' | translate | safeHtml"></h1>
    <h2 class="subtitle2" [innerHtml]="'HOME.SUBBIENVENUE' | translate | safeHtml"></h2>
  </div>
  <div class="divGames">
    <div class="game" (click)="goToUrl('/lol')">
      <img class="imgGame" src="assets\img\gameLoL.jpg" />
    </div>
    <div class="game" (click)="goToUrl('/rl')">
      <img class="imgGame" src="assets\img\gameRL.jpg" />
    </div>
    <div class="game" (click)="goToUrl('/tft')">
      <img class="imgGame" src="assets\img\gameTFT.webp" />
    </div>
  </div>

  <div class="divContent">
    <!-- Section Notre Vision -->
    <section id="about" class="about-section">
      <h4 [innerHtml]="'HOME.TITLE1' | translate | safeHtml"></h4>
      <div class="container">
        <h3 [innerHtml]="'HOME.CONTENT1' | translate | safeHtml"></h3>
      </div>
    </section>

    <!-- Section Pourquoi TeamUpp -->
    <section id="why" class="why-section">
      <div class="container2">
        <div class="divSplits">
          <div class="splitflex borderRightSplit">
            <h5 [innerHtml]="'HOME.TITLE2' | translate | safeHtml"></h5>
            <h3 class="padding20 justify" [innerHtml]="'HOME.CONTENT2' | translate | safeHtml"></h3>
          </div>
          <div class="splitflex borderRightSplit">
            <h5 [innerHtml]="'HOME.TITLE3' | translate | safeHtml"></h5>
            <h3 class="padding20 justify" [innerHtml]="'HOME.CONTENT3' | translate | safeHtml"></h3>
          </div>
          <div class="splitflex">
            <h5 [innerHtml]="'HOME.TITLE4' | translate | safeHtml"></h5>
            <h3 class="padding20 justify" [innerHtml]="'HOME.CONTENT4' | translate | safeHtml"></h3>
          </div>
        </div>
      </div>
    </section>
    <!-- Section Notre Vision -->
    <section id="about" class="ready-section">
      <h4 [innerHtml]="'HOME.TITLE5' | translate | safeHtml"></h4>
      <div class="container">
        <h3 [innerHtml]="'HOME.CONTENT5' | translate | safeHtml"></h3>
      </div>
    </section>

    <!-- Section Réseaux Sociaux -->
    <section id="social" class="social-section">
      <div class="container">
        <div class="divFooter">
          <div>
            <div class="divConditions">
              <span class="buttonsConditions" [innerHtml]="'CGU.TITLE' | translate | safeHtml"  (click)="goToUrl('/cgu')"></span>
              <span class="buttonsConditions" [innerHtml]="'PRIVACY.TITLE' | translate | safeHtml"  (click)="goToUrl('/privacy')"></span>
            </div>
            <h6 [innerHtml]="'HOME.FOOTERRIGHTS' | translate | safeHtml"></h6>
          </div>
          <div class="divSocial">
            <span class="txtSocial" [innerHtml]="'HOME.SOCIALNETWORKS' | translate | safeHtml"></span>
            <div class="social-links">
              <a href="https://www.twitch.tv/Hato_TV" target="_blank" rel="noopener noreferrer">
                <img src="assets/img/icons/twitchIcon.jpg" alt="Twitch">
              </a>
              <a href="https://www.youtube.com/@Hato_YT" target="_blank" rel="noopener noreferrer">
                <img src="assets/img/icons/youtubeIcon.jpg" alt="Youtube">
              </a>
              <a href="https://www.instagram.com/hato_yns/" target="_blank" rel="noopener noreferrer">
                <img src="assets/img/icons/instagramIcon.jpg" alt="Instagram">
              </a>
              <a href="https://www.tiktok.com/@hato.tv" target="_blank" rel="noopener noreferrer">
                <img src="assets/img/icons/tiktokIcon.jpg" alt="Tiktok">
              </a>
              <a href="https://discord.gg/pM4Eu5quyg" target="_blank" rel="noopener noreferrer">
                <img src="assets/img/icons/discordIcon.jpg" alt="Discord">
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
